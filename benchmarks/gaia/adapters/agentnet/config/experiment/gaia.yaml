# AgentNet on GAIA (2023 validation). Same agent/graph hyper-parameters as the
# released bigbenchhard_new_abilities.yaml; only the ability names are GAIA-specific.
experiment_config:
  LLM: openai_compat          # model name itself comes from LLM_MODEL in .env
  dataset: gaia
  agent_num: 3
  forward_path_max_length: 3
  max_execution_times: 5
  user_react: True

default_agent_config: &default_agent_config
  LLM: openai_compat
  abilities:
    reasoning: 0.6
    knowledge: 0.6
    web_search: 0.6
    file_processing: 0.6
    calculation: 0.6
  executor_memory_limit: 40
  embedding_cache_limit: 1000
  router_memory_limit: -1
  decay_rate: 0.1
  decay_interval: 10
  router_retrieval_num: 3
  executor_retrieval_num: 3

agent_config:
- id: 0
  config: *default_agent_config
- id: 1
  config: *default_agent_config
- id: 2
  config: *default_agent_config

agent_graph_config:
  graph_type: complete
